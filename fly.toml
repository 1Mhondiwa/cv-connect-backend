app = "cv-connect-backend"

# Kill signal for graceful shutdown
kill_signal = "SIGINT"
kill_timeout = 30

[processes]
web = "node server.js"

[build]
  # Use the existing Dockerfile
  image = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[mounts]
# If you need persistent storage for uploads
# source = "uploads_data"
# destination = "/app/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]